<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent Blackbox</title>
  <desc id="desc">A social preview image for Agent Blackbox, a flight recorder for AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d27"/>
      <stop offset="1" stop-color="#0f141b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="54" y="52" width="1092" height="526" rx="28" fill="url(#panel)" stroke="#2f3a48" filter="url(#shadow)"/>

  <g transform="translate(96 92)">
    <rect x="0" y="0" width="1008" height="60" rx="16" fill="#0b1017" stroke="#303b49"/>
    <circle cx="32" cy="30" r="8" fill="#ff5f56"/>
    <circle cx="58" cy="30" r="8" fill="#ffbd2e"/>
    <circle cx="84" cy="30" r="8" fill="#27c93f"/>
    <text x="132" y="38" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">blackbox run -- codex exec "fix the failing tests"</text>
  </g>

  <g transform="translate(96 198)">
    <text x="0" y="0" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700">Agent Blackbox</text>
    <text x="4" y="52" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">A flight recorder for AI agents</text>
    <text x="4" y="132" fill="#d0d7de" font-family="Arial, Helvetica, sans-serif" font-size="34">The agent said it worked.</text>
    <text x="4" y="178" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Blackbox shows what actually happened.</text>
  </g>

  <g transform="translate(96 468)">
    <rect x="0" y="0" width="1008" height="76" rx="18" fill="#0b1017" stroke="#303b49"/>
    <text x="34" y="48" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">terminal logs • git diff • tests • policy violations</text>
  </g>

  <g transform="translate(920 224)" opacity="0.95">
    <rect x="0" y="0" width="148" height="184" rx="20" fill="#111820" stroke="#3b4655" stroke-width="4"/>
    <path d="M34 54h80M34 88h80M34 122h52" stroke="#58a6ff" stroke-width="12" stroke-linecap="round"/>
    <path d="M48 160l22 22 48-58" fill="none" stroke="#7ee787" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
